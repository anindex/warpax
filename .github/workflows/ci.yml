name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAX_PLATFORMS: cpu
  WARPAX_JIT_CACHE: "1"
  UV_VERSION: "0.10.9"

jobs:
  # Full test suite on 3.13; core compatibility on 3.12 and 3.14 below.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: ${{ github.job }}
          python-version: "3.13"

      - name: Install development dependencies
        run: uv sync --locked --extra dev --extra solver --extra design --extra einfields

      - name: Restore JAX compile cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/warpax/jax
          key: jax-${{ runner.os }}-3.13-${{ hashFiles('uv.lock') }}-${{ hashFiles('src/**/*.py', 'tests/**/*.py', 'scripts/**/*.py') }}
          restore-keys: |
            jax-${{ runner.os }}-3.13-${{ hashFiles('uv.lock') }}-

      - name: Test suite
        run: uv run --no-sync pytest --maxfail=10

      # Exercise the opt-in runtime type checks.
      - name: Beartype smoke (EC modules)
        env:
          WARPAX_BEARTYPE: "1"
        run: uv run --no-sync pytest tests/test_classification.py tests/test_ec_verifier.py

  core-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: ${{ github.job }}
          python-version: "${{ matrix.python-version }}"

      - name: Install development dependencies
        run: uv sync --locked --extra dev --extra solver --extra design

      - name: Restore JAX compile cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/warpax/jax
          key: jax-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}-${{ hashFiles('src/**/*.py', 'tests/**/*.py', 'scripts/**/*.py') }}
          restore-keys: |
            jax-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}-

      - name: Core test tier
        run: >
          uv run --no-sync pytest --maxfail=10
          tests/test_classification.py
          tests/test_frame_free.py
          tests/test_worst_observer_analytic.py
          tests/test_ec_verifier.py
          tests/test_bug_hunt_regressions.py
          tests/test_shift_kinematics.py
          tests/test_benchmarks/

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: ${{ github.job }}
          python-version: "3.12"

      - name: Install development dependencies
        run: uv sync --locked --extra dev

      - name: Ruff check
        run: uv run --no-sync ruff check src/ tests/ scripts/ benchmarks/ examples/

      - name: Ruff format check
        run: uv run --no-sync ruff format --check src/ tests/ scripts/ benchmarks/ examples/

      - name: Bash syntax check
        run: bash -n reproduce_all.sh

      - name: Script import smoke
        run: uv run --no-sync python scripts/run_analysis.py --help

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: ${{ github.job }}
          python-version: "3.12"

      - name: Install documentation dependencies
        run: uv sync --locked --extra docs --extra design

      - name: Build docs with --strict
        run: uv run --no-sync mkdocs build --strict
