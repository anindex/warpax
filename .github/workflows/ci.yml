name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAX_PLATFORMS: cpu
  WARPAX_JIT_CACHE: "1"
  UV_VERSION: "0.10.9"

jobs:
  # The whole suite on the primary Python. Cross-version compatibility is covered
  # by the cheaper core job below: version breaks are API and typing breaks, not
  # physics breaks.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install package + dev deps
        run: uv sync --extra dev --extra solver --extra design --extra einfields

      - name: Restore JAX compile cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/warpax/jax
          key: jax-cache-3.13-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            jax-cache-3.13-

      - name: Test suite
        run: uv run pytest --maxfail=10

      # jaxtyping and beartype annotations are only enforced when this is set, so
      # without a run under it a wrong shape annotation ships silently.
      - name: Beartype smoke (EC modules)
        env:
          WARPAX_BEARTYPE: "1"
        run: uv run pytest tests/test_classification.py tests/test_ec_verifier.py

  # Cross-version compatibility: the certification engine, the frame-free path and
  # the regression nets. Catches import and typing breakage per version without
  # running the whole suite three times.
  core-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install package + dev deps
        run: uv sync --extra dev --extra solver --extra design

      - name: Restore JAX compile cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/warpax/jax
          key: jax-cache-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            jax-cache-${{ matrix.python-version }}-

      - name: Core test tier
        run: >
          uv run pytest --maxfail=10
          tests/test_classification.py
          tests/test_frame_free.py
          tests/test_worst_observer_analytic.py
          tests/test_ec_verifier.py
          tests/test_bug_hunt_regressions.py
          tests/test_shift_kinematics.py
          tests/test_benchmarks/

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install package + dev deps
        run: uv sync --extra dev

      - name: Ruff check
        run: uv run ruff check src/ tests/ scripts/ benchmarks/ examples/

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/ scripts/ benchmarks/ examples/

      - name: Bash syntax check
        run: bash -n reproduce_all.sh

      - name: Script import smoke
        run: uv run python scripts/run_analysis.py --help

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install package + docs extra
        run: uv sync --extra docs --extra design

      - name: Build docs with --strict
        run: uv run mkdocs build --strict
