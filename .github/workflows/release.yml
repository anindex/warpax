name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v1.4.0"
        required: true

# No blanket grant: each job asks for exactly what it needs, so the PyPI job is
# the only one that can mint an OIDC token and the build job cannot write.
permissions: {}

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.10.9"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Resolve the tag and check it against the package version
        id: v
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version=$(python3 -c 'import tomllib, pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')
          if [ "$tag" != "v$version" ]; then
            echo "tag $tag does not match the pyproject version $version" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build the sdist and wheel
        run: uv build

      # Catches a malformed long_description before PyPI rejects the upload,
      # which it does without leaving the version usable again.
      - name: Check the distributions
        run: uv tool run --from twine twine check --strict dist/*

      # The release body is the CHANGELOG section for this version, so the two
      # cannot drift: a tag with no section is a tag that was never written up.
      - name: Extract the changelog section
        run: |
          awk -v v="## [${{ steps.v.outputs.version }}]" \
            'index($0, v) == 1 { p = 1; next } p && /^## \[/ { exit } p' \
            CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no section for ${{ steps.v.outputs.version }}" >&2
            exit 1
          fi

      - name: Upload the distributions
        uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - name: Upload the release notes
        uses: actions/upload-artifact@v5
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  pypi:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/warpax
    permissions:
      # Trusted publishing: PyPI verifies this OIDC token against the publisher
      # configured for the project, so there is no long-lived API token to leak.
      id-token: write

    steps:
      - name: Download the distributions
        uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Makes a re-run after a partial failure a no-op rather than an error.
          skip-existing: true

  github-release:
    needs: [build, pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download the distributions
        uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/

      - name: Download the release notes
        uses: actions/download-artifact@v5
        with:
          name: release-notes

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${{ needs.build.outputs.tag }}" dist/* \
            --title "${{ needs.build.outputs.tag }}" \
            --notes-file release-notes.md
