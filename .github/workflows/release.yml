name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v1.5.1"
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.13.4"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Check tag and package versions
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 - <<'PY'
          import ast
          import json
          import os
          import pathlib
          import re
          import tomllib

          tag = os.environ["RELEASE_TAG"]
          versions = {
              "tag": tag.removeprefix("v"),
              "pyproject.toml": tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"],
              "CITATION.cff": re.search(r"^version:\s*(\S+)", pathlib.Path("CITATION.cff").read_text(), re.M).group(1),
              ".zenodo.json": json.loads(pathlib.Path(".zenodo.json").read_text())["version"],
          }
          module = ast.parse(pathlib.Path("src/warpax/__init__.py").read_text())
          versions["warpax.__version__"] = next(
              ast.literal_eval(node.value)
              for node in module.body
              if isinstance(node, ast.Assign)
              and any(isinstance(target, ast.Name) and target.id == "__version__" for target in node.targets)
          )
          if not tag.startswith("v") or len(set(versions.values())) != 1:
              listing = ", ".join(f"{name}={value}" for name, value in versions.items())
              raise SystemExit(f"Tag, pyproject.toml, CITATION.cff, .zenodo.json and warpax.__version__ must agree: {listing}")
          version = versions["pyproject.toml"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"tag=v{version}", file=output)
              print(f"version={version}", file=output)
          PY

      - name: Require successful CI for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          conclusion=$(gh run list --workflow ci.yml --commit "$(git rev-parse HEAD)" \
            --branch main --event push --limit 1 --json conclusion --jq '.[0].conclusion')
          if [ "$conclusion" != success ]; then
            echo "Push this commit to main and wait for CI to pass before releasing." >&2
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
          enable-cache: false

      - name: Build and check distributions
        run: |
          uv build --no-sources
          uv tool run --from twine==7.0.0 twine check --strict dist/*

      - name: Extract release notes from the changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="## [$VERSION]" \
            'index($0, v) == 1 { p = 1; next } p && /^## \[/ { exit } p' \
            CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md has no notes for $VERSION" >&2
            exit 1
          fi

      - name: Upload distributions and release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/
            release-notes.md
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  pypi:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/warpax
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true

  github-release:
    needs: [build, pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file release-notes.md
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag \
              --title "$RELEASE_TAG" --notes-file release-notes.md
          fi
