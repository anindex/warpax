name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v1.5.1"
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.10.9"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Check tag and package versions
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 - <<'PY'
          import ast
          import os
          import pathlib
          import tomllib

          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          module = ast.parse(pathlib.Path("src/warpax/__init__.py").read_text())
          package_version = next(
              ast.literal_eval(node.value)
              for node in module.body
              if isinstance(node, ast.Assign)
              and any(isinstance(target, ast.Name) and target.id == "__version__" for target in node.targets)
          )
          if package_version != version or os.environ["RELEASE_TAG"] != f"v{version}":
              raise SystemExit("Tag, pyproject.toml, and warpax.__version__ must agree")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"tag=v{version}", file=output)
              print(f"version={version}", file=output)
          PY

      - name: Require successful CI for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          conclusion=$(gh run list --workflow ci.yml --commit "$(git rev-parse HEAD)" \
            --branch main --event push --limit 1 --json conclusion --jq '.[0].conclusion')
          if [ "$conclusion" != success ]; then
            echo "Push this commit to main and wait for CI to pass before releasing." >&2
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
          enable-cache: false

      - name: Build and check distributions
        run: |
          uv build --no-sources
          uv tool run --from twine==7.0.0 twine check --strict dist/*

      - name: Extract release notes from the changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="## [$VERSION]" \
            'index($0, v) == 1 { p = 1; next } p && /^## \[/ { exit } p' \
            CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md has no notes for $VERSION" >&2
            exit 1
          fi

      - name: Upload distributions and release notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: |
            dist/
            release-notes.md
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  pypi:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/warpax
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          skip-existing: true

  github-release:
    needs: [build, pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file release-notes.md
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag \
              --title "$RELEASE_TAG" --notes-file release-notes.md
          fi
